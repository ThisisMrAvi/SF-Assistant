<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="${styleUri}">
    <title>Salesforce Assistant</title>
</head>


<body>
    <!-- Notification toast -->
    <div id="notificationContainer">
    </div>

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2>SF Assistant</h2>
            <button id="closeSidebarBtn" class="close-btn">&times;</button>
        </div>
        <a href="" data-page="meta-explorer">Metadata Explorer</a>
        <a href="" data-page="data-export">Data Export</a>
        <a href="" data-page="data-import">Data Import</a>
        <a href="" data-page="settings">Settings</a>
        <div class="footer" style="bottom: 0px">
            <p class="info-text">
                Built with ❤️ for Salesforce developers worldwide.<br>
            </p>
        </div>
    </div>

    <!-- Main container -->
    <div id="sf-assistant-container">
        <div class="header-container">
            <button id="appBtn" class="menu-btn">☰</button>
            <div class="header-details">
                <span id="orgInfo" class="info-text"></span>
            </div>
        </div>
        <!-- Main content -->
        <div id="content">Loading...</div>
    </div>

    <!-- Modal -->
    <section id="modalSection" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-container">
            <div class="modal-header">
                <h2 id="modalTitle"></h2>
                <button id="modalCloseBtn" class="btn btn-neutral modal-close">&times;</button>
            </div>
            <div id="modalBody" class="modal-body">
                <!-- modal content gets injected here -->
            </div>
        </div>
    </section>

    <!-- Modal backdrop -->
    <div id="modalBackdrop" class="modal-backdrop hidden" role="presentation"></div>
    <!-- Modal end -->

    <script type="module" src="${scriptUri}"></script>
</body>

</html>
