<div class="data-import-container">
    <!-- Configure Import -->
    <div class="import-section">
        <h2>Configure Import</h2>
        <div class="form-grid">
            <label>
                API Type
                <select id="apiType">
                    <option value="enterprise">Enterprise (default)</option>
                    <option value="tooling">Tooling</option>
                    <option value="partner">Partner</option>
                </select>
            </label>

            <label>
                Action
                <select id="actionType">
                    <option value="insert">Insert</option>
                    <option value="update" selected>Update</option>
                    <option value="upsert">Upsert</option>
                    <option value="delete">Delete</option>
                </select>
            </label>

            <label>
                Object
                <input type="text" id="objectName" placeholder="Account" />
            </label>

            <label class="span-2">
                Data
                <textarea id="dataInput" placeholder="Paste data here"></textarea>
            </label>

            <label>
                Batch size
                <input type="number" id="batchSize" value="200" />
            </label>

            <label>
                Threads
                <input type="number" id="threads" value="6" />
            </label>
        </div>

        <div class="button-row">
            <button class="btn btn-primary">Run Update</button>
            <button class="btn" disabled>Cancel Queued</button>
            <button class="btn" disabled>Retry Failed</button>
            <button class="btn">Copy (Excel format)</button>
            <button class="btn">Copy (CSV)</button>
        </div>
    </div>

    <!-- Field Mapping -->
    <div class="import-section">
        <h2>Field Mapping</h2>
        <div class="form-grid">
            <label>
                Id
                <input type="text" value="Id" readonly />
            </label>
            <label>
                Name
                <input type="text" value="Name" readonly />
            </label>
            <label>
                ChannelProgramName
                <input type="text" value="ChannelProgramName" readonly />
            </label>
        </div>
    </div>
</div>

<!-- Result Table -->
<div class="import-results">
    <table class="meta-table">
        <thead>
            <tr>
                <th>-</th>
                <th>Id</th>
                <th>Name</th>
                <th>ChannelProgramName</th>
                <th>ChannelProgramLevelName</th>
                <th>Acc_Name_Formula__c</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>[Account]</td>
                <td><a href="#">0015g00000Ad1BvAAJ</a></td>
                <td>Avinash</td>
                <td></td>
                <td></td>
                <td>Avinash - Key account -</td>
            </tr>
        </tbody>
    </table>
</div>
